name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    # PostgreSQL and Redis run as service containers on the CI machine, so the full suite
    # (including the real-thread concurrency tests) runs against the real thing on every push.
    # The credentials below exist only inside this throwaway CI job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: medreminder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d medreminder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://ci_user:ci_password@localhost:5432/medreminder
      REDIS_URL: redis://localhost:6379/0
      DJANGO_DEBUG: "true"

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run

      - name: API schema has no warnings
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null

      - name: Run the tests with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Keep the coverage report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
